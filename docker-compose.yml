# A complete self-hosted stack: the API, PostgreSQL, Redis and MinIO (S3-
# compatible photo storage). See DEPLOY.md, "Option A: Docker Compose".
#
# Before the first `docker compose up -d`:
#   1. cp .env.example .env, then set at least SECRET_KEY (and SMTP_* for
#      email). Database, Redis and storage settings below override .env.
#   2. Put the database schema SQL files from the hand-over into ./schema/,
#      named so they sort in the order they must run (01_..., 02_...).
#      PostgreSQL runs them once, when its data volume is first created.
#   3. Set PUBLIC_MEDIA_URL (in .env or the shell) to the address phones will
#      load photos from, e.g. https://media.example.org/apl-media. The default
#      only works on this machine.
#
# Change POSTGRES_PASSWORD and the MinIO credentials before exposing anything.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment: &app-env
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/apl_db
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_BUCKET: apl-media
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_PUBLIC_BASE_URL: ${PUBLIC_MEDIA_URL:-http://localhost:9000/apl-media}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Applies sql/ and checks the bucket, then exits. The app starts after it.
  migrate:
    build: .
    command: python -m app.db.migrate
    env_file:
      - .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: apl_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apl_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # photos, read anonymously by the app's users
      - "9001:9001"   # admin console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Creates the bucket and lets anyone read (not list or write) its objects,
  # which is what the public photo URLs need. Safe to run every time.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/apl-media &&
      mc anonymous set download local/apl-media
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}

volumes:
  pgdata:
  miniodata:

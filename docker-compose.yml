# A complete self-hosted stack: the API, PostgreSQL, Redis, RustFS (S3-
# compatible photo storage) and, on a server, Caddy for automatic HTTPS.
# Step-by-step guides: docs/run-on-your-computer.md and
# docs/deploy-on-your-own-server.md.
#
# Before the first `docker compose up -d --build`:
#   1. Copy .env.example to .env and fill in the "Docker Compose stack"
#      section plus SECRET_KEY (and SMTP_* for email). Compose refuses to
#      start while a required value is missing. The database, Redis and
#      storage settings below override anything else in .env.
#   2. Put the database schema SQL files from the hand-over into ./schema/,
#      named so they sort in the order they must run (01_..., 02_...).
#      PostgreSQL runs them once, when its data volume is first created.
#
# On a server, COMPOSE_PROFILES=https in .env also starts Caddy, which gets
# HTTPS certificates for API_DOMAIN and MEDIA_DOMAIN by itself.
#
# Image versions are pinned; bump them deliberately.

# Fixed, so volume and network names do not depend on the folder's name.
name: apl-backend

x-app-env: &app-env
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/apl_db
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: s3
  AWS_S3_ENDPOINT_URL: http://storage:9000
  AWS_S3_BUCKET: apl-media
  AWS_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
  AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
  S3_PUBLIC_BASE_URL: ${PUBLIC_MEDIA_URL:-http://localhost:9000/apl-media}

services:
  app:
    build: .
    # This computer only. From outside, the API is reached through Caddy.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Checks the schema, applies sql/ and checks the bucket, then exits. The
  # API starts only if it succeeded.
  migrate:
    build: .
    command: python -m app.db.migrate
    env_file:
      - .env
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: apl_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d apl_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Photo storage. RustFS speaks the S3 API; any S3-compatible service can
  # take its place (DEPLOY.md, section 4). Port 9000 serves the photos.
  storage:
    image: rustfs/rustfs:1.0.3
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_VOLUMES: /data
      RUSTFS_CONSOLE_ENABLE: "false"
    # This computer only. From outside, photos are served through Caddy.
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - storagedata:/data
    depends_on:
      storage-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # RustFS runs as UID 10001; a new named volume belongs to root.
  storage-permissions:
    image: alpine:3.22
    volumes:
      - storagedata:/data
    command: chown -R 10001:10001 /data

  # Creates the bucket and lets anyone read (not list or write) its objects,
  # which is what the public photo URLs need. Safe to run every time.
  storage-init:
    image: amazon/aws-cli:2.38.5
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        s3() { aws --endpoint-url http://storage:9000 "$$@"; }
        s3 s3api head-bucket --bucket apl-media 2>/dev/null || s3 s3api create-bucket --bucket apl-media
        s3 s3api put-bucket-policy --bucket apl-media --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::apl-media/*"]}]}'
        echo "bucket apl-media ready"

  # HTTPS in front of the API and the photos, with certificates from Let's
  # Encrypt obtained and renewed automatically. Only on a server: started
  # when COMPOSE_PROFILES=https, and needs API_DOMAIN and MEDIA_DOMAIN to
  # point at this machine. See deploy/Caddyfile.
  caddy:
    image: caddy:2.11.7
    profiles: ["https"]
    depends_on:
      - app
      - storage
    environment:
      API_DOMAIN: ${API_DOMAIN:-}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$API_DOMAIN" ] || [ -z "$$MEDIA_DOMAIN" ]; then
          echo "Set API_DOMAIN and MEDIA_DOMAIN in .env first."; exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    restart: unless-stopped

  # Copies every photo into ${BACKUP_DIR}/photos (only what changed since the
  # last run). Not a running service: deploy/backup.sh starts it.
  photo-backup:
    image: amazon/aws-cli:2.38.5
    profiles: ["backup"]
    environment:
      AWS_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ${BACKUP_DIR:-./backups}/photos:/backup
    command: ["s3", "sync", "s3://apl-media", "/backup", "--endpoint-url", "http://storage:9000", "--only-show-errors"]

volumes:
  pgdata:
  storagedata:
  caddydata:
  caddyconfig:

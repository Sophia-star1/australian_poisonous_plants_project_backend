# Runs the same tools, at the same locked versions, as CI (.github/workflows/
# ci.yml). Local hooks rather than the upstream mirrors: those pin their own
# ruff and mypy versions, and mypy in an isolated environment cannot see the
# project's dependencies, so it reported errors CI would not.
#
#   uv run pre-commit install

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy app
        language: system
        types: [python]
        pass_filenames: false

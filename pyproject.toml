[project]
name = "apl-backend"
version = "0.1.0"
description = "FastAPI enterprise-grade RESTful API scaffold"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]",
    "gunicorn",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "asyncpg",
    "alembic",
    "python-jose[cryptography]",
    "bcrypt",
    "aioboto3",
    "redis[hiredis]>=5.0",
    "structlog",
    "python-multipart",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
    "celery[redis]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
    "celery[redis]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 warns about function calls in argument defaults, which is precisely how
# FastAPI declares dependencies and parameter metadata. Not a mutable-default
# hazard here: these markers are evaluated once and never mutated.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

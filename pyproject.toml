[project]
name = "apl-backend"
version = "0.1.0"
description = "FastAPI enterprise-grade RESTful API scaffold"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]",
    "gunicorn",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "asyncpg",
    "alembic",
    "python-jose[cryptography]",
    "bcrypt",
    "aioboto3",
    "redis[hiredis]>=5.0",
    "structlog",
    "python-multipart",
    "httpx",
    # Plant screening. ONNX Runtime rather than torch: the exported graph is
    # numerically identical (1.4e-06 over random inputs) at 97 MB installed
    # instead of 726 MB, and 110 MB resident instead of 426 MB. Cloud Run has
    # a hard memory cap, so that gap decides whether the service starts.
    "onnxruntime>=1.17",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    # Decodes images too large for Pillow to hold in memory: it shrinks JPEG
    # and WebP while decoding and streams PNG row by row. `[binary]` brings a
    # prebuilt libvips, so the Docker image needs no system packages.
    "pyvips[binary]>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
    "celery[redis]",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "pre-commit",
    "celery[redis]",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# B008 warns about function calls in argument defaults, which is precisely how
# FastAPI declares dependencies and parameter metadata. Not a mutable-default
# hazard here: these markers are evaluated once and never mutated.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.mypy.overrides]]
# onnxruntime and pyvips ship no py.typed marker and no stubs on PyPI. Without
# this the import alone is an error, which buries the errors that matter.
module = ["onnxruntime.*", "pyvips.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# aioboto3 and botocore ship no type information (stubs exist as separate,
# heavyweight packages). Only app/services/storage_service.py imports them.
module = ["aioboto3", "aioboto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

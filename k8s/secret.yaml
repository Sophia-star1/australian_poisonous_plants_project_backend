apiVersion: v1
kind: Secret
metadata:
  name: apl-backend-secret
type: Opaque
data:
  SECRET_KEY: <base64-encoded-value>
  DATABASE_URL: <base64-encoded-value>
  REDIS_URL: <base64-encoded-value>
  AWS_ACCESS_KEY_ID: <base64-encoded-value>
  AWS_SECRET_ACCESS_KEY: <base64-encoded-value>
  AWS_S3_ENDPOINT_URL: <base64-encoded-value>
  CELERY_BROKER_URL: <base64-encoded-value>

# Google Cloud Build configuration for Cloud Run deployment

steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "."

  # Push the image to Artifact Registry
  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "${_SERVICE_NAME}"
      - "--image"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
      - "--region"
      - "${_REGION}"
      - "--platform"
      - "managed"
      - "--port"
      - "8000"
      - "--allow-unauthenticated"
      - "--min-instances"
      - "0"
      - "--max-instances"
      - "10"
      # 1Gi rather than 512Mi: the screening model is ~110 MB resident once
      # loaded, and decoding a phone photo costs more again — a 4000x3000
      # JPEG is 36 MB of raw RGB before it is resized. At 512Mi the container
      # is killed rather than answering slowly, so this is not a tuning knob.
      - "--memory"
      - "1Gi"
      - "--cpu"
      - "1"
      # NOTE: --set-env-vars and --set-secrets REPLACE the whole set on every
      # deploy. Anything added by hand in the Cloud Run console is wiped the
      # next time this pipeline runs, so every variable the service needs has
      # to be listed here.
      #
      # The leading ^;^ switches the delimiter to ';' because ALLOWED_ORIGINS
      # contains commas.
      - "--set-env-vars"
      - '^;^APP_NAME=${_SERVICE_NAME};DEBUG=false;ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8081","http://localhost:19006"];SUPABASE_URL=${_SUPABASE_URL};EMAIL_FROM=${_EMAIL_FROM};SMTP_HOST=${_SMTP_HOST};SMTP_PORT=${_SMTP_PORT};SMTP_USERNAME=${_SMTP_USERNAME}'
      # The Supabase secret key bypasses row level security: Secret Manager
      # only, never an env var and never a client bundle. The same goes for
      # SMTP_PASSWORD, the mailbox's password: anyone holding it can read and
      # delete the whole mailbox, not just send from it.
      #
      # Every secret named here must exist before this runs, or the deploy
      # fails: create `smtp-password` in Secret Manager first. RESEND_API_KEY
      # stays mounted but is unused while SMTP_HOST is set; blanking
      # _SMTP_HOST switches mail back to Resend without a code change.
      - "--set-secrets"
      - "SECRET_KEY=secret-key:latest,DATABASE_URL=database-url:latest,SUPABASE_SERVICE_ROLE_KEY=supabase-secret-key:latest,RESEND_API_KEY=resend-api-key:latest,SMTP_PASSWORD=smtp-password:latest"

substitutions:
  _SERVICE_NAME: apl-backend
  _REGION: asia-southeast1
  _REPO_NAME: apl-backend
  # Not a secret — the project URL is already public in the mobile bundle.
  # Kept as a substitution so a staging project is a one-line override.
  _SUPABASE_URL: https://nxiokqrqxtjjqjiexknj.supabase.co
  # Review-outcome mail goes out through the domain's own Namecheap Private
  # Email mailbox, which already has SPF, DKIM and MX published. The sender
  # must be the mailbox it logs in as: Private Email refuses, or marks as
  # spoofed, mail "from" any other address. Replies come back to it too, so
  # no separate EMAIL_REPLY_TO is needed.
  _EMAIL_FROM: Australian Poisonous Plants <info@aupoisonousplants.world>
  # 587 upgrades with STARTTLS. Cloud Run blocks outbound port 25, not 587.
  _SMTP_HOST: mail.privateemail.com
  _SMTP_PORT: "587"
  _SMTP_USERNAME: info@aupoisonousplants.world

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/${_SERVICE_NAME}:latest"
